user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log /dev/stdout combined;

    limit_req_zone $binary_remote_addr zone=dashboard_api:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=dashboard_connections:10m;

    server {
        listen 80;
        server_name healthcaredataai.com;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name healthcaredataai.com;

        auth_basic "HealthcareDataAI Command Center";
        auth_basic_user_file /etc/nginx/command-center.htpasswd;

        ssl_certificate /etc/letsencrypt/live/healthcaredataai.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/healthcaredataai.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 10m;

        client_max_body_size 1k;
        limit_conn dashboard_connections 20;

        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;

        location = /api/query { return 404; }
        location = /api/docs { return 404; }
        location = /api/openapi.json { return 404; }

        location /api/ {
            limit_req zone=dashboard_api burst=20 nodelay;
            limit_except GET { deny all; }
            proxy_pass http://127.0.0.1:4199;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 5s;
            proxy_read_timeout 65s;
            proxy_hide_header Access-Control-Allow-Origin;
        }

        location / {
            limit_except GET { deny all; }
            proxy_pass http://127.0.0.1:4199;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
        }
    }
}
