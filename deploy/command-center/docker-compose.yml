services:
  nginx:
    image: nginx@sha256:1d13701a5f9f3fb01aaa88cef2344d65b6b5bf6b7d9fa4cf0dca557a8d7702ba
    container_name: cms-command-center-nginx
    network_mode: host
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    volumes:
      - /etc/cms-data/command-center-nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/cms-data/command-center.htpasswd:/etc/nginx/command-center.htpasswd:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    security_opt:
      - no-new-privileges:true
